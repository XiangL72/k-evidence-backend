spring.application.name=k-comparison
# Local-only foundation. Use a dedicated comparison database, never kreview.
spring.datasource.url=jdbc:postgresql://127.0.0.1:${COMPARISON_DB_PORT:5432}/kcomparison
spring.datasource.username=${COMPARISON_DB_USERNAME}
spring.datasource.password=${COMPARISON_DB_PASSWORD:}
# Flyway owns schema changes; Hibernate only validates mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
comparison.ai.enabled=${AI_ENABLED:false}
server.address=127.0.0.1
server.port=8081
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.file-size-threshold=0
server.error.include-message=never
server.error.include-stacktrace=never
# PostgreSQL constraint diagnostics may include row contents. Do not log them.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
